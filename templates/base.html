<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Recce{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="top">
    <div class="bar">
      <span class="brand">Recce</span>
      <nav>
        {% for key, item in reports.items() %}
          <a href="{{ url_for('report', slug=key) }}" class="{{ 'on' if key == slug }}">{{ item[0] }}</a>
        {% endfor %}
      </nav>
      <form method="post" action="{{ url_for('sync') }}">
        <button type="submit" class="btn">Sync reports</button>
      </form>
    </div>
  </header>
  <main>
    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in msgs %}<p class="note {{ cat }}">{{ msg }}</p>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
